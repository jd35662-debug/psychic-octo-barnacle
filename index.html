<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3D Gallery Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <h1>3D Gallery Explorer</h1>
      <div class="controls">
        <button id="lockBtn">Enter Explore Mode</button>
        <label>
          Statue Slot
          <select id="slotSelect"></select>
        </label>
        <label>
          Statue Model (.glb/.gltf only)
          <input id="statueInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" multiple />
        </label>
        <label>
          Paintings (images: .png .jpg .jpeg .webp .gif)
          <input id="paintingInput" type="file" accept="image/*" multiple />
        </label>
      </div>
      <p>
        Use <strong>WASD</strong> to move, <strong>mouse</strong> to look around.<br />
        Upload files from your local <code>statues</code> and <code>paintings</code> folders.
      </p>
    </div>
    <div id="info">Click "Enter Explore Mode" (or click the scene) to start.</div>

    <script type="module" src="main.js"></script>
  </body>
</html>
